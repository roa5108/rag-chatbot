<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>본부 지식 가이드 챗봇</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row">

    <!-- 왼쪽 사이드바 영역 -->
    <div class="w-full md:w-80 bg-slate-900 text-white p-6 flex flex-col justify-between shadow-xl shrink-0">
        <div>
            <div class="mb-6">
                <h1 class="text-2xl font-bold tracking-tight text-indigo-400">Project AI</h1>
                <p class="text-xs text-slate-400">RAG Assistant v1.0</p>
            </div>

            <!-- 🎯 새 채팅 버튼 -->
            <button onclick="createNewChat()" class="w-full py-3 mb-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                <span>➕</span> 새 대화 시작
            </button>

            <!-- 기능 ①: 검색 범위 / 옵션 컨트롤러 패널 -->
            <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50 space-y-4 mb-4 md:mb-0">
                <h3 class="text-sm font-bold text-slate-300 border-b border-slate-700 pb-2">🔍 검색 범위/옵션</h3>
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">검색 범위</label>
                    <div class="flex gap-4 text-sm">
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="search_mode" value="single" class="accent-indigo-500" onchange="toggleDocSelect()"> single
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="search_mode" value="multi" checked class="accent-indigo-500" onchange="toggleDocSelect()"> multi
                        </label>
                    </div>
                </div>

                <div id="doc-select-container" class="opacity-50 pointer-events-none transition-all">
                    <label class="block text-xs text-slate-400 mb-1">질의할 PDF 선택</label>
                    <select id="selected-doc" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs text-white focus:outline-none">
                        <option value="">문서를 로딩 중...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 🎯 채팅 히스토리 목록 영역 -->
        <div class="mt-6 flex-1 flex flex-col min-h-0">
            <p class="text-xs font-bold text-slate-500 tracking-wider uppercase mb-3">💬 최근 채팅 기록</p>
            <div id="chat-history-list" class="space-y-1.5 max-h-[30vh] overflow-y-auto pr-1">
                <!-- 자바스크립트로 동적 렌더링될 영역 -->
            </div>
        </div>

        <!-- 요건 충족: 세션 종료(로그아웃) 및 어드민 연동 패널 -->
        <div class="space-y-2 pt-4 border-t border-slate-800 mt-4 md:mt-0">
            <button onclick="handleLogout()" class="block w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-center text-xs font-medium rounded-xl transition">
                🚪 시스템 로그아웃
            </button>
            <a href="/admin" id="admin-btn" class="hidden w-full py-2.5 bg-rose-950/40 hover:bg-rose-950/70 border border-rose-900 text-rose-300 text-center text-sm font-medium rounded-xl transition">
                🛠️ 관리자 스튜디오
            </a>
        </div>
    </div>

    <!-- 오른쪽 메인 채팅 영역 -->
    <div class="flex-1 flex flex-col h-[calc(100vh-200px)] md:h-screen bg-white">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-lg font-bold text-slate-800">💡 본부 지식 가이드 챗봇</h2>
        </div>

        <!-- 대화 컨테이너 -->
        <div id="chat-container" class="flex-1 p-4 md:p-6 overflow-y-auto space-y-6 bg-slate-50/50">
            <!-- 자바스크립트에서 환영 메시지 및 대화를 동적으로 핸들링합니다 -->
        </div>

        <!-- 하단 입력 필드 -->
        <div class="p-4 border-t border-slate-100 bg-white">
            <div class="max-w-4xl mx-auto flex gap-2">
                <input type="text" id="chat-input" placeholder="질문을 입력하세요... ('모르는질문' 입력시 품질로그 적재 테스트 가능)" class="flex-1 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 bg-slate-50">
                <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl font-medium text-sm transition shrink-0">전송</button>
            </div>
        </div>
    </div>

    <script>
        // 🎯 전역 변수 통합 정의
        let currentChatId = null;
        let chatSessions = JSON.parse(localStorage.getItem('chat_sessions')) || {};

        // 🎯 [수정] DOMContentLoaded 통합 관리 (중복 제거)
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if(!token) {
                window.location.href = '/login';
                return;
            }
            if(localStorage.getItem('isAdmin') === 'true') {
                document.getElementById('admin-btn').classList.remove('hidden');
                document.getElementById('admin-btn').classList.add('block');
            }
            loadDocumentOptions();

            // 세션 히스토리 로드 프로세스
            const sessionIds = Object.keys(chatSessions);
            if (sessionIds.length > 0) {
                const latestChatId = sessionIds.sort((a, b) => chatSessions[b].updatedAt - chatSessions[a].updatedAt)[0];
                loadChatSession(latestChatId);
            } else {
                createNewChat();
            }
            renderHistorySidebar();
        });

        async function loadDocumentOptions() {
            try {
                const response = await fetch('/api/chat/documents', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if(response.status === 401) { window.location.href = '/login'; return; }
                const data = await response.json();
                const selectElement = document.getElementById('selected-doc');
                selectElement.innerHTML = '';
                if(data.documents && data.documents.length > 0) {
                    data.documents.forEach(doc => {
                        const opt = document.createElement('option');
                        opt.value = doc; opt.innerText = doc;
                        selectElement.appendChild(opt);
                    });
                }
            } catch(e) { console.error(e); }
        }

        function toggleDocSelect() {
            const mode = document.querySelector('input[name="search_mode"]:checked').value;
            const container = document.getElementById('doc-select-container');
            if(mode === 'single') container.classList.remove('opacity-50', 'pointer-events-none');
            else container.classList.add('opacity-50', 'pointer-events-none');
        }

        // 🎯 [기능] 화면에 메시지 컴포넌트 추가 전용 기능
        function appendMessage(role, text, sources = []) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 ${role === 'user' ? 'justify-end' : ''}`;

            if(role === 'user') {
                wrapper.innerHTML = `<div class="bg-indigo-600 text-white p-4 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] text-sm">${text}</div>`;
            } else {
                let sourcesHtml = '';
                if(sources && sources.length > 0) {
                    let items = sources.map((src, idx) => `
                        <div class="flex justify-between py-1 text-xs border-b border-slate-100 last:border-none">
                            <span class="text-slate-600 font-mono">${idx+1}. ${src.filename} (p.${src.page})</span>
                            <span class="text-emerald-600 font-semibold">score: ${src.score ? src.score.toFixed(4) : '0.0000'}</span>
                        </div>
                    `).join('');
                    sourcesHtml = `
                        <div class="mt-3 border border-slate-200 rounded-lg bg-white overflow-hidden">
                            <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full px-3 py-2 bg-slate-50 text-left text-xs text-slate-500 flex justify-between">
                                <span>🔎 근거 출처 보기</span><span>▼</span>
                            </button>
                            <div class="p-3 bg-white space-y-1 hidden">${items}</div>
                        </div>`;
                }
                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                    <div class="max-w-[85%]">
                        <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-sm text-slate-700">${text}</div>
                        ${sourcesHtml}
                    </div>`;
            }
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        // 🎯 [수정] 전송 프로세스 내부에 로컬 스토리지 보관 트리거 장착 완료
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if(!message) return;

            // 1. 화면 출력 및 인풋 초기화
            appendMessage('user', message);
            input.value = '';

            // 2. 🎯 로컬 스토리지 세션에 저장
            onUserSendMessage(message);

            showLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        message: message,
                        search_mode: document.querySelector('input[name="search_mode"]:checked').value,
                        selected_doc: document.getElementById('selected-doc').value
                    })
                });
                const data = await response.json();

                hideLoading();

                // 3. 화면 출력
                appendMessage('ai', data.answer, data.sources);

                // 4. 🎯 AI 응답 및 근거 출처 로컬 스토리지에 백업
                onAiResponseReceive(data.answer, data.sources);

            } catch(e) {
                hideLoading();
                appendMessage('ai', '서버와 통신할 수 없습니다.');
            }
        }

        function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")) {
                localStorage.clear();
                window.location.href = '/login';
            }
        }
        document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        function showLoading() {
            const container = document.getElementById('chat-container');
            const loadingWrapper = document.createElement('div');
            loadingWrapper.id = 'ai-loading-indicator';
            loadingWrapper.className = 'flex gap-4 items-center animate-pulse';

            loadingWrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                <div class="bg-white px-4 py-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-sm text-slate-400 flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    AI가 문서를 분석하여 답변을 생성하고 있습니다...
                </div>
            `;
            container.appendChild(loadingWrapper);
            container.scrollTop = container.scrollHeight;
        }

        function hideLoading() {
            const indicator = document.getElementById('ai-loading-indicator');
            if (indicator) { indicator.remove(); }
        }

        // 🎯 [기능] 새 채팅방 생성
        function createNewChat() {
            const chatId = 'chat_' + Date.now();
            chatSessions[chatId] = {
                title: "새로운 대화",
                messages: [],
                updatedAt: Date.now()
            };
            currentChatId = chatId;
            saveToLocalStorage();

            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                    <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-sm text-slate-700">
                        안녕하세요! 사내 RAG 지식 검색 허브입니다. 업무 가이드 및 지침에 대해 질문해 주세요. 문서를 기반으로 정확히 답변해 드립니다.
                    </div>
                </div>
            `;
            renderHistorySidebar();
        }

        // 🎯 [수정] 기존 채팅방 복원 시 appendMessage 컴포넌트와 완벽 결합
        function loadChatSession(chatId) {
            if (!chatSessions[chatId]) return;
            currentChatId = chatId;

            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = '';

            // 초기 환영 메시지 먼저 기본 출력
            chatContainer.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                    <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-sm text-slate-700">
                        안녕하세요! 사내 RAG 지식 검색 허브입니다. 업무 가이드 및 지침에 대해 질문해 주세요. 문서를 기반으로 정확히 답변해 드립니다.
                    </div>
                </div>
            `;

            // 저장되어 있던 메시지 흐름 순차 빌드
            chatSessions[chatId].messages.forEach(msg => {
                appendMessage(msg.role, msg.text, msg.sources || []);
            });

            renderHistorySidebar();
        }

        // 🎯 [기능] 사이드바 이력 목록 갱신
        function renderHistorySidebar() {
            const listContainer = document.getElementById('chat-history-list');
            listContainer.innerHTML = '';

            const sortedSessions = Object.keys(chatSessions).sort((a, b) => chatSessions[b].updatedAt - chatSessions[a].updatedAt);

            if (sortedSessions.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-500 italic p-2">이전 기록이 없습니다.</p>`;
                return;
            }

            sortedSessions.forEach(chatId => {
                const session = chatSessions[chatId];
                const isActive = chatId === currentChatId;

                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2 text-xs rounded-xl transition truncate font-medium flex items-center justify-between ${
                    isActive ? 'bg-slate-800 text-indigo-400 font-semibold border-l-2 border-indigo-500' : 'text-slate-400 hover:bg-slate-800/40 hover:text-white'
                }`;
                // 버튼 자체에 클릭 이벤트 바인딩
                btn.addEventListener('click', () => loadChatSession(chatId));

                btn.innerHTML = `
                    <span class="truncate mr-2">📝 ${session.title}</span>
                    <span class="text-slate-600 hover:text-rose-400 font-bold px-1 transition-colors delete-btn">×</span>
                `;

                // X 버튼 클릭 시 삭제 트리거 처리
                btn.querySelector('.delete-btn').addEventListener('click', (event) => {
                    deleteChatSession(chatId, event);
                });

                listContainer.appendChild(btn);
            });
        }

        // 🎯 [기능] 특정 채팅 기록 삭제
        function deleteChatSession(chatId, event) {
            event.stopPropagation();
            if (!confirm("이 대화 기록을 삭제하시겠습니까?")) return;

            delete chatSessions[chatId];
            saveToLocalStorage();

            const remaining = Object.keys(chatSessions);
            if (currentChatId === chatId) {
                if (remaining.length > 0) loadChatSession(remaining[0]);
                else createNewChat();
            } else {
                renderHistorySidebar();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('chat_sessions', JSON.stringify(chatSessions));
        }

        // 🎯 [동작부 연동] 데이터 기록 보관 함수들
        function onUserSendMessage(text) {
            if (!chatSessions[currentChatId]) return;

            if (chatSessions[currentChatId].messages.length === 0) {
                chatSessions[currentChatId].title = text.substring(0, 12) + (text.length > 12 ? '...' : '');
            }

            chatSessions[currentChatId].messages.push({ role: 'user', text: text });
            chatSessions[currentChatId].updatedAt = Date.now();
            saveToLocalStorage();
            renderHistorySidebar();
        }

        function onAiResponseReceive(aiText, sources = []) {
            if (!chatSessions[currentChatId]) return;

            chatSessions[currentChatId].messages.push({ role: 'ai', text: aiText, sources: sources });
            chatSessions[currentChatId].updatedAt = Date.now();
            saveToLocalStorage();
        }
    </script>
</body>
</html>
