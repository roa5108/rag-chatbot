<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>본부 지식 가이드 챗봇</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <!-- 📱 모바일 전용 상단 고정 헤더 바 -->
    <div class="flex md:hidden items-center justify-between p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md shrink-0">
        <div>
            <h1 class="text-base font-bold text-indigo-400">Project AI</h1>
            <p class="text-[10px] text-slate-400">RAG & SQL Assistant v1.0</p>
        </div>
        <button onclick="toggleMobileSidebar()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-700 text-slate-200 rounded-lg font-semibold text-xs transition-colors flex items-center gap-1">
            ⚙️ 옵션 및 기록
        </button>
    </div>

    <!-- 🏢 왼쪽 사이드바 영역 -->
    <div id="sidebar-container" class="hidden md:flex fixed md:relative inset-y-0 left-0 top-[57px] md:top-0 w-full md:w-80 bg-slate-900 text-white p-6 flex-col justify-between shadow-xl shrink-0 z-40 overflow-y-auto md:overflow-y-visible border-r border-slate-800 transition-all duration-200">
        <div>
            <div class="mb-6 hidden md:block">
                <h1 class="text-2xl font-bold tracking-tight text-indigo-400">Project AI</h1>
                <p class="text-xs text-slate-400">RAG & SQL Assistant v1.0</p>
            </div>

            <!-- 새 대화 버튼 -->
            <button onclick="createNewChat(); closeMobileSidebarIfNeeded();" class="w-full py-3 mb-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                <span>➕</span> 새 대화 시작
            </button>

            <!-- 🎯 [신규] 작업 모드 스위치 컨트롤러 (RAG vs Text-to-SQL) -->
            <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50 space-y-4 mb-4">
                <h3 class="text-sm font-bold text-slate-300 border-b border-slate-700 pb-2">🎯 챗봇 수행 모드</h3>
                <div class="flex gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700">
                    <button id="btn-mode-rag" onclick="setChatMode('rag')" class="flex-1 py-1.5 text-xs font-semibold rounded-md bg-indigo-600 text-white transition">📄 문서 RAG</button>
                    <button id="btn-mode-sql" onclick="setChatMode('sql')" class="flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition">💾 Text-to-SQL</button>
                </div>
            </div>

            <!-- 검색 범위 / 옵션 패널 (RAG 모드에서만 사용) -->
            <div id="rag-option-panel" class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50 space-y-4 mb-4 md:mb-0">
                <h3 class="text-sm font-bold text-slate-300 border-b border-slate-700 pb-2">🔍 RAG 검색 범위/옵션</h3>
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">검색 범위</label>
                    <div class="flex gap-4 text-sm">
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="search_mode" value="single" class="accent-indigo-500" onchange="toggleDocSelect()"> single
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="search_mode" value="multi" checked class="accent-indigo-500" onchange="toggleDocSelect()"> multi
                        </label>
                    </div>
                </div>

                <div id="doc-select-container" class="opacity-50 pointer-events-none transition-all">
                    <label class="block text-xs text-slate-400 mb-1">질의할 PDF 선택</label>
                    <select id="selected-doc" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs text-white focus:outline-none">
                        <option value="">문서를 로딩 중...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 채팅 히스토리 목록 영역 -->
        <div class="mt-6 flex-1 flex flex-col min-h-0">
            <p class="text-xs font-bold text-slate-500 tracking-wider uppercase mb-3">💬 최근 채팅 기록</p>
            <div id="chat-history-list" class="space-y-1.5 max-h-[30vh] md:max-h-[35vh] overflow-y-auto pr-1">
                <!-- 자바스크립트 동적 렌더링 -->
            </div>
        </div>

        <!-- 시스템 세션 관리 -->
        <div class="space-y-2 pt-4 border-t border-slate-800 mt-6 md:mt-0 pb-16 md:pb-0">
            <button onclick="handleLogout()" class="block w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-center text-xs font-medium rounded-xl transition">
                🚪 시스템 로그아웃
            </button>
            <a href="/admin" id="admin-btn" class="hidden w-full py-2.5 bg-rose-950/40 hover:bg-rose-950/70 border border-rose-900 text-rose-300 text-center text-sm font-medium rounded-xl transition">
                🛠️ 관리자 스튜디오
            </a>
        </div>
    </div>

    <!-- 💬 오른쪽 메인 채팅 영역 -->
    <div class="flex-1 flex flex-col h-[calc(100vh-57px)] md:h-screen bg-white min-w-0">
        <div class="p-4 md:p-5 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
            <h2 class="text-base md:text-lg font-bold text-slate-800">💡 본부 지식 가이드 & Text-to-SQL 챗봇</h2>
            <span id="current-mode-badge" class="text-xs font-bold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-lg">📄 RAG 모드</span>
        </div>

        <!-- 대화 컨테이너 -->
        <div id="chat-container" class="flex-1 p-4 md:p-6 overflow-y-auto space-y-6 bg-slate-50/50">
        </div>

        <!-- 하단 입력 필드 -->
        <div class="p-3 md:p-4 border-t border-slate-100 bg-white sticky bottom-0 z-10 shrink-0">
            <div class="max-w-4xl mx-auto flex gap-2">
                <input type="text" id="chat-input" placeholder="질문을 입력하세요..." class="flex-1 border border-slate-200 rounded-xl px-4 py-2.5 md:py-3 text-base focus:outline-none focus:border-indigo-500 bg-slate-50">
                <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 md:px-5 py-2.5 md:py-3 rounded-xl font-medium text-sm transition shrink-0">전송</button>
            </div>
        </div>
    </div>

    <script>
        // 전역 상태 변수
        let currentChatId = null;
        let currentChatMode = 'rag'; // 기본값 'rag', 버튼 클릭 시 'sql'로 변경
        let chatSessions = JSON.parse(localStorage.getItem('chat_sessions')) || {};

        window.toggleMobileSidebar = function() {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('flex');
            }
        };

        function closeMobileSidebarIfNeeded() {
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar-container');
                sidebar.classList.add('hidden');
                sidebar.classList.remove('flex');
            }
        }

        // 🎯 모드 스위치 처리 (RAG 문서검색 / Text-to-SQL)
        function setChatMode(mode) {
            currentChatMode = mode;
            const btnRag = document.getElementById('btn-mode-rag');
            const btnSql = document.getElementById('btn-mode-sql');
            const badge = document.getElementById('current-mode-badge');
            const ragOptionPanel = document.getElementById('rag-option-panel');

            if(mode === 'sql') {
                btnSql.className = "flex-1 py-1.5 text-xs font-semibold rounded-md bg-indigo-600 text-white transition";
                btnRag.className = "flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition";
                badge.className = "text-xs font-bold px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-lg";
                badge.innerText = "💾 Text-to-SQL 모드";
                ragOptionPanel.classList.add('opacity-40', 'pointer-events-none');
            } else {
                btnRag.className = "flex-1 py-1.5 text-xs font-semibold rounded-md bg-indigo-600 text-white transition";
                btnSql.className = "flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition";
                badge.className = "text-xs font-bold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-lg";
                badge.innerText = "📄 RAG 모드";
                ragOptionPanel.classList.remove('opacity-40', 'pointer-events-none');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if(!token) {
                window.location.href = '/login';
                return;
            }
            if(localStorage.getItem('isAdmin') === 'true') {
                document.getElementById('admin-btn').classList.remove('hidden');
                document.getElementById('admin-btn').classList.add('block');
            }
            loadDocumentOptions();

            const sessionIds = Object.keys(chatSessions);
            if (sessionIds.length > 0) {
                const latestChatId = sessionIds.sort((a, b) => chatSessions[b].updatedAt - chatSessions[a].updatedAt)[0];
                loadChatSession(latestChatId);
            } else {
                createNewChat();
            }
            renderHistorySidebar();
        });

        async function loadDocumentOptions() {
            try {
                const response = await fetch('/api/chat/documents', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if(response.status === 401) { window.location.href = '/login'; return; }
                const data = await response.json();
                const selectElement = document.getElementById('selected-doc');
                selectElement.innerHTML = '';
                if(data.documents && data.documents.length > 0) {
                    data.documents.forEach(doc => {
                        const opt = document.createElement('option');
                        opt.value = doc; opt.innerText = doc;
                        selectElement.appendChild(opt);
                    });
                }
            } catch(e) { console.error(e); }
        }

        function toggleDocSelect() {
            const mode = document.querySelector('input[name="search_mode"]:checked').value;
            const container = document.getElementById('doc-select-container');
            if(mode === 'single') container.classList.remove('opacity-50', 'pointer-events-none');
            else container.classList.add('opacity-50', 'pointer-events-none');
        }

        function appendMessage(role, text, sources = []) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-3 md:gap-4 ${role === 'user' ? 'justify-end' : ''}`;

            if(role === 'user') {
                wrapper.innerHTML = `<div class="bg-indigo-600 text-white p-3 md:p-4 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] text-sm break-words">${text}</div>`;
            } else {
                let sourcesHtml = '';
                if(sources && sources.length > 0) {
                    let items = sources.map((src, idx) => `
                        <div class="flex flex-col sm:flex-row sm:justify-between py-1 text-xs border-b border-slate-100 last:border-none gap-0.5">
                            <span class="text-slate-600 font-mono break-all">${idx+1}. ${src.filename} (p.${src.page})</span>
                            <span class="text-emerald-600 font-semibold whitespace-nowrap">score: ${src.score ? src.score.toFixed(4) : '0.0000'}</span>
                        </div>
                    `).join('');
                    sourcesHtml = `
                        <div class="mt-3 border border-slate-200 rounded-lg bg-white overflow-hidden">
                            <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full px-3 py-2 bg-slate-50 text-left text-xs text-slate-500 flex justify-between items-center">
                                <span>🔎 근거 출처 / 메타데이터</span><span>▼</span>
                            </button>
                            <div class="p-3 bg-white space-y-1 hidden max-h-48 overflow-y-auto">${items}</div>
                        </div>`;
                }

                // 코드 블록(SQL) 형태 포맷팅을 위한 가공
                let formattedText = text;
                if(text.includes('SELECT') || text.includes('```sql')) {
                    formattedText = `<pre class="bg-slate-900 text-emerald-400 p-3 rounded-xl text-xs font-mono overflow-x-auto whitespace-pre-wrap">${text.replace(/```sql|```/g, '')}</pre>`;
                }

                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                    <div class="max-w-[85%] flex-1">
                        <div class="bg-white p-3 md:p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-sm text-slate-700 break-words leading-relaxed">${formattedText}</div>
                        ${sourcesHtml}
                    </div>`;
            }
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        // 🎯 모드(chat_mode)를 포함하여 API 호출 수행
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if(!message) return;

            appendMessage('user', message);
            input.value = '';

            onUserSendMessage(message);
            showLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        message: message,
                        search_mode: document.querySelector('input[name="search_mode"]:checked').value,
                        selected_doc: document.getElementById('selected-doc').value,
                        chat_mode: currentChatMode // 🎯 핵심: rag 또는 sql 모드 전송
                    })
                });
                const data = await response.json();

                hideLoading();
                appendMessage('ai', data.answer, data.sources);
                onAiResponseReceive(data.answer, data.sources);

            } catch(e) {
                hideLoading();
                appendMessage('ai', '서버와 통신할 수 없습니다.');
            }
        }

        function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")) {
                localStorage.clear();
                window.location.href = '/login';
            }
        }
        document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        function showLoading() {
            const container = document.getElementById('chat-container');
            const loadingWrapper = document.createElement('div');
            loadingWrapper.id = 'ai-loading-indicator';
            loadingWrapper.className = 'flex gap-3 md:gap-4 items-center animate-pulse';

            const loadingText = currentChatMode === 'sql' ? '구글 시트 메타데이터 기반 SQL 생성 중...' : 'AI가 문서를 분석 중입니다...';

            loadingWrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                <div class="bg-white px-4 py-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-sm text-slate-400 flex items-center gap-2 max-w-[85%]">
                    <svg class="animate-spin h-4 w-4 text-indigo-500 shrink-0" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs md:text-sm truncate">${loadingText}</span>
                </div>
            `;
            container.appendChild(loadingWrapper);
            container.scrollTop = container.scrollHeight;
        }

        function hideLoading() {
            const indicator = document.getElementById('ai-loading-indicator');
            if (indicator) { indicator.remove(); }
        }

        function createNewChat() {
            const chatId = 'chat_' + Date.now();
            chatSessions[chatId] = {
                title: "새로운 대화",
                messages: [],
                updatedAt: Date.now()
            };
            currentChatId = chatId;
            saveToLocalStorage();

            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = `
                <div class="flex gap-3 md:gap-4">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                    <div class="bg-white p-3 md:p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-sm text-slate-700">
                        안녕하세요! RAG 지식 검색 및 Text-to-SQL 허브입니다. 좌측 메뉴에서 원하는 모드를 선택 후 질문해 주세요.
                    </div>
                </div>
            `;
            renderHistorySidebar();
        }

        function loadChatSession(chatId) {
            if (!chatSessions[chatId]) return;
            currentChatId = chatId;

            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = `
                <div class="flex gap-3 md:gap-4">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                    <div class="bg-white p-3 md:p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-sm text-slate-700">
                        안녕하세요! RAG 지식 검색 및 Text-to-SQL 허브입니다. 좌측 메뉴에서 원하는 모드를 선택 후 질문해 주세요.
                    </div>
                </div>
            `;

            chatSessions[chatId].messages.forEach(msg => {
                appendMessage(msg.role, msg.text, msg.sources || []);
            });

            renderHistorySidebar();
        }

        function renderHistorySidebar() {
            const listContainer = document.getElementById('chat-history-list');
            listContainer.innerHTML = '';

            const sortedSessions = Object.keys(chatSessions).sort((a, b) => chatSessions[b].updatedAt - chatSessions[a].updatedAt);

            if (sortedSessions.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-500 italic p-2">이전 기록이 없습니다.</p>`;
                return;
            }

            sortedSessions.forEach(chatId => {
                const session = chatSessions[chatId];
                const isActive = chatId === currentChatId;

                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2 text-xs rounded-xl transition truncate font-medium flex items-center justify-between ${
                    isActive ? 'bg-slate-800 text-indigo-400 font-semibold border-l-2 border-indigo-500' : 'text-slate-400 hover:bg-slate-800/40 hover:text-white'
                }`;

                btn.addEventListener('click', () => {
                    loadChatSession(chatId);
                    closeMobileSidebarIfNeeded();
                });

                btn.innerHTML = `
                    <span class="truncate mr-2">📝 ${session.title}</span>
                    <span class="text-slate-600 hover:text-rose-400 font-bold px-1 transition-colors delete-btn">×</span>
                `;

                btn.querySelector('.delete-btn').addEventListener('click', (event) => {
                    deleteChatSession(chatId, event);
                });

                listContainer.appendChild(btn);
            });
        }

        function deleteChatSession(chatId, event) {
            event.stopPropagation();
            if (!confirm("이 대화 기록을 삭제하시겠습니까?")) return;

            delete chatSessions[chatId];
            saveToLocalStorage();

            const remaining = Object.keys(chatSessions);
            if (currentChatId === chatId) {
                if (remaining.length > 0) loadChatSession(remaining[0]);
                else createNewChat();
            } else {
                renderHistorySidebar();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('chat_sessions', JSON.stringify(chatSessions));
        }

        function onUserSendMessage(text) {
            if (!chatSessions[currentChatId]) return;

            if (chatSessions[currentChatId].messages.length === 0) {
                chatSessions[currentChatId].title = text.substring(0, 12) + (text.length > 12 ? '...' : '');
            }

            chatSessions[currentChatId].messages.push({ role: 'user', text: text });
            chatSessions[currentChatId].updatedAt = Date.now();
            saveToLocalStorage();
            renderHistorySidebar();
        }

        function onAiResponseReceive(aiText, sources = []) {
            if (!chatSessions[currentChatId]) return;

            chatSessions[currentChatId].messages.push({ role: 'ai', text: aiText, sources: sources });
            chatSessions[currentChatId].updatedAt = Date.now();
            saveToLocalStorage();
        }
    </script>
</body>
</html>
