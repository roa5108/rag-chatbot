<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project AI - 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
        <div class="text-center mb-8">
            <h1 id="page-title" class="text-3xl font-bold text-slate-800 tracking-tight">Project AI</h1>
            <p id="page-subtitle" class="text-sm text-slate-500 mt-1">RAG 기반 본부 지식 가이드 시스템</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">사원 계정 (ID)</label>
                <input type="text" id="username" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 transition-all text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 transition-all text-sm">
            </div>

            <!-- 회원가입 모드일 때만 열리는 관리자 체크 박스 -->
            <div id="admin-check-container" class="hidden flex items-center gap-2 pt-1 pl-1">
                <input type="checkbox" id="is_admin" class="w-4 h-4 rounded accent-indigo-600">
                <label for="is_admin" class="text-xs text-slate-600 cursor-pointer font-medium">관리자(Admin) 권한 부여</label>
            </div>

            <button type="submit" id="btn-submit" class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition shadow-md text-sm mt-2">로그인</button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-slate-100">
            <button onclick="toggleMode()" id="btn-toggle" class="text-xs text-indigo-600 hover:underline font-semibold">신규 사원 계정 생성 (회원가입)</button>
        </div>
    </div>

    <script>
        let isRegisterMode = false;

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('page-title').innerText = isRegisterMode ? "사원 계정 생성" : "Project AI";
            document.getElementById('page-subtitle').innerText = isRegisterMode ? "정보 보완 시스템 권한 할당" : "RAG 기반 본부 지식 가이드 시스템";
            document.getElementById('btn-submit').innerText = isRegisterMode ? "회원가입 완료" : "로그인";
            document.getElementById('btn-toggle').innerText = isRegisterMode ? "기존 계정으로 로그인하기" : "신규 사원 계정 생성 (회원가입)";
            document.getElementById('admin-check-container').classList.toggle('hidden', !isRegisterMode);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (isRegisterMode) {
                const isAdmin = document.getElementById('is_admin').checked;
                try {
                    const res = await fetch(`/api/auth/register?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&is_admin=${isAdmin}`, { method: 'POST' });
                    const data = await res.json();
                    if(!res.ok) throw new Error(data.detail || '가입 처리 중 오류 발생');
                    alert("계정 등록 완료! 설정한 정보로 로그인해 주세요.");
                    toggleMode();
                } catch(err) { alert(err.message); }
            } else {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                try {
                    const response = await fetch('/api/auth/login', { method: 'POST', body: formData });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || '로그인에 실패했습니다.');

                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('isAdmin', data.is_admin);
                    localStorage.setItem('username', username);

                    window.location.href = (data.is_admin === true || data.is_admin === 'true') ? '/admin' : '/';
                } catch (err) { alert(err.message); }
            }
        });
    </script>
</body>
</html>
